<header class="main-header">
  <nav class="nav-container">
    <div class="logo">
      🎬 <a routerLink="/cartelera">Cine App</a>
    </div>
    <ul class="nav-links">
      <li><a routerLink="/cartelera" routerLinkActive="active">Cartelera</a></li>
    
      @if (!usuarioActual()) {
        <li><a routerLink="/login" routerLinkActive="active">Iniciar Sesión</a></li>
        <li><a routerLink="/registro" routerLinkActive="active">Registro</a></li>
      } @else {
        <li class="user-greeting">
          👤 Hola, <strong>{{ usuarioActual()?.nombre }}</strong>
        </li>
        <li>
          <button (click)="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
        </li>
      }

      <li><a routerLink="/admin" routerLinkActive="active">Panel Admin</a></li>
    </ul>
  </nav>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
