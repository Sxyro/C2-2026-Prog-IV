<div class="login-container">
  <div class="bulbs">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <h2>Iniciar Sesión</h2>

  <form (ngSubmit)="ingresar()">
    <div class="form-group">
      <label>Email:</label>

      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="tuemail@ejemplo.com"
      />
    </div>

    <div class="form-group">
      <label>Contraseña:</label>

      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Tu contraseña"
      />
    </div>

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Iniciar Sesión' }}
    </button>
  </form>
</div>

@if (modalAbierto) {
  <div class="modal-overlay" (click)="cerrarModal()">
    <div
      class="modal"
      [class.modal-error]="modalTipo === 'error'"
      [class.modal-exito]="modalTipo === 'exito'"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="modal-cerrar"
        (click)="cerrarModal()"
      >
        ×
      </button>

      <div class="modal-icon">
        {{ modalTipo === 'error' ? '!' : '✓' }}
      </div>

      <div class="modal-contenido">
        <span class="modal-kicker">
          {{ modalTipo === 'error' ? 'ATENCIÓN' : 'CINE IMPERIAL' }}
        </span>

        <h2>{{ modalTitulo }}</h2>

        <p>{{ modalMensaje }}</p>
      </div>

      <button
        type="button"
        class="modal-boton"
        (click)="cerrarModal()"
      >
        {{ modalTipo === 'exito' ? 'Continuar' : 'Entendido' }}
      </button>
    </div>
  </div>
}
