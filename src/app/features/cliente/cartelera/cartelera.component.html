<div class="container">
  <h2>En cartelera esta semana</h2>

  <div class="grid-peliculas">
    @for (pelicula of peliculas(); track pelicula.id) {
      <article class="card-pelicula">
        <img [src]="pelicula.portadaUrl" [alt]="pelicula.nombre" class="portada">

        <div class="borde-perforado"></div>

        <div class="info">
          <h3>{{ pelicula.nombre }}</h3>

          <div class="badges">
            <span class="badge">{{ pelicula.formato }}</span>
            <span class="badge">{{ pelicula.idioma }}</span>
            <span class="duracion">{{ pelicula.duracionMinutos }} min</span>
          </div>

          <p class="sinopsis">{{ pelicula.sinopsis }}</p>

          <button [routerLink]="['/reserva', pelicula.id]" class="btn btn-marquesina btn-reservar">
            Reservar entradas
          </button>
        </div>
      </article>
    }
  </div>

  @if (peliculas().length === 0) {
    <p class="vacio">Todavía no hay funciones cargadas. Volvé más tarde.</p>
  }
</div>
