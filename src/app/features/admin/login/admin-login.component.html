<div class="login-container">
  <div class="bulbs"><span></span><span></span><span></span><span></span><span></span></div>
  <h2>Ingreso de Personal</h2>
  <p class="subtitulo">Acceso exclusivo para administradores y empleados del cine.</p>

  <form (ngSubmit)="ingresar()">
    <div class="form-group">
      <label>Email:</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="staff@cine.com"
      />
    </div>

    <div class="form-group">
      <label>Contraseña:</label>
      <input
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="••••••••"
      />
    </div>

    @if (errorMensaje()) {
      <p class="mensaje-error">{{ errorMensaje() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
